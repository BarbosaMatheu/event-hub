# Full stack: PostgreSQL + Spring Boot API + React (nginx).
#   docker compose up --build
# Web app:   http://localhost:3000
# API/Swagger: http://localhost:8080/swagger-ui/index.html
#
# Every secret below has a LOCAL-DEMO default so the project runs with one command.
# For anything beyond a local demo, copy .env.example to .env and set real values.

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: eventhub-db
    environment:
      POSTGRES_DB: eventhub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      # Host port 5433 (not 5432) so this never collides with a PostgreSQL installed on your machine.
      # It is only needed to connect from an IDE/psql: the API reaches the database through the
      # Docker network (postgres-db:5432), not through this mapping.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  eventhub-api:
    build: ./backend
    container_name: eventhub-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/eventhub_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-secret-change-me-please-32chars}
      # The only way to get an administrator account (public registration never creates one).
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      # Loads a demo catalogue (categories + events) when the database is empty.
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Madrid}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Swagger is off in the prod profile; the demo turns it on.
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      SPRINGDOC_API_DOCS_ENABLED: "true"
    depends_on:
      postgres-db:
        condition: service_healthy

  eventhub-web:
    build: ./frontend
    container_name: eventhub-web
    ports:
      - "3000:80"
    depends_on:
      eventhub-api:
        condition: service_healthy

volumes:
  postgres_data:
