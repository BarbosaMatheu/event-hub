# Flyway owns the schema even in dev - Hibernate only checks it matches,
# it never auto-generates DDL. Keeps dev and prod behaving the same way,
# so schema drift gets caught locally instead of surprising you in prod.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

logging.level.com.eventhub=DEBUG
