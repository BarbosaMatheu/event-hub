# Same principle as dev: Flyway owns the schema, Hibernate only validates.
# This is the setting that matters most in prod - ddl-auto=update here would
# let a bad entity change silently alter a production table.


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true

# Swagger UI off in prod - no reason to expose the API's internal shape
# publicly once real users depend on it.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

logging.level.com.eventhub=INFO
logging.level.org.hibernate.SQL=WARN
