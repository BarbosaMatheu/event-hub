spring.application.name=event-hub

# Overridable via env vars (see docker-compose.yml / SPRING_DATASOURCE_*).
# The fallback values below are only for local, non-Docker development and
# must never be real credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventhub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non.contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.enable-hateoas=false

# No fallback on purpose: the app must fail to start rather than sign JWTs
# with a hardcoded/default secret. Set JWT_SECRET before running.
api.security.token.secret=${JWT_SECRET}
