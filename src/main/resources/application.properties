spring.application.name=event-hub

# Default profile if none is set. Use "dev" locally and "prod" in
# production deployments: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Settings shared by every profile ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventhub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.enable-hateoas=false

# No fallback on purpose: the app must fail to start rather than sign JWTs
# with a hardcoded/default secret. Set JWT_SECRET before running.
api.security.token.secret=${JWT_SECRET}
