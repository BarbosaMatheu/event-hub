spring.application.name=event-hub

# "dev" is used when no profile is set. Override with SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# ---------------------------------------------------------------- Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventhub_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Flyway owns the schema. Hibernate only validates that the entities match it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading outside of a transaction: services map entities to DTOs.
spring.jpa.open-in-view=false
# Turns N+1 lazy loads (e.g. order items, events) into a few batched queries.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------------------------------------------------------- Web
server.shutdown=graceful
spring.data.web.pageable.default-page-size=12
spring.data.web.pageable.max-page-size=50
logging.pattern.level=%5p [%X{requestId:-}]

# ---------------------------------------------------------------- Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------------------------------------------------------------- Security
# No fallback on purpose: the app must fail to start rather than sign JWTs
# with a default secret. Set JWT_SECRET (>= 32 characters) before running.
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.login-max-failures=5
app.security.login-window-minutes=15

# ---------------------------------------------------------------- Business rules
# Event times are venue-local wall-clock times; this zone decides what "now" means.
app.timezone=${APP_TIMEZONE:UTC}
# Unpaid orders release their tickets after this many minutes.
app.orders.pending-ttl-minutes=${ORDERS_PENDING_TTL_MINUTES:30}
app.orders.expiration-check-interval-ms=60000

# ---------------------------------------------------------------- Bootstrap / demo data
# Creates an ADMIN account at startup if both values are set and it does not exist yet.
app.bootstrap-admin.login=${ADMIN_LOGIN:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
# Loads demo categories/events when the database has none.
app.seed.enabled=${APP_SEED_ENABLED:false}
