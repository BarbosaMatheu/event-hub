# Local development. Never use these defaults outside your machine.
spring.jpa.show-sql=false
logging.level.com.eventhub=DEBUG
logging.level.org.hibernate.SQL=DEBUG

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Convenient local data: a demo catalogue and an admin account (override via env vars).
app.seed.enabled=${APP_SEED_ENABLED:true}
app.bootstrap-admin.login=${ADMIN_LOGIN:admin}
app.bootstrap-admin.password=${ADMIN_PASSWORD:Admin@12345}
