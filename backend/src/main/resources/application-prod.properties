# Production-like settings.
spring.jpa.show-sql=false
logging.level.com.eventhub=INFO

# Swagger is off by default; enable explicitly with SPRINGDOC_SWAGGER_UI_ENABLED=true
# and SPRINGDOC_API_DOCS_ENABLED=true (docker-compose does this for the demo).
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Behind a reverse proxy (nginx): trust X-Forwarded-* so the real client IP is visible
# (used by the login rate limiter).
server.forward-headers-strategy=native
